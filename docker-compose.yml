services:
  postgres:
    image: paradedb/paradedb:pg18
    container_name: dubjug-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dubjug_development
    ports:
      - "5433:5432"
    volumes:
      - dubjug_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dubjug_development"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dubjug_pgdata:
