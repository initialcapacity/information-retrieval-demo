name: "Build"
on: push
jobs:
  run-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:0.25.3-pg18@sha256:82d0c8bb0263c4320cb321591dd6831ecdd04b4b27328ef658358a9a8c383ac5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ir_demo_development
        options: >-
          --health-cmd "pg_isready -U postgres -d ir_demo_development"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 26
          cache: "gradle"
      - name: "Create test template database"
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --port 5433 --username postgres --dbname postgres < databases/create_databases.sql
      - name: "Migrate"
        run: ./gradlew :databases:catalog:migrate
      - name: "Build"
        run: ./gradlew build
