name: "Build"
on: push
jobs:
  run-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dubjug_development
        options: >-
          --health-cmd "pg_isready -U postgres -d dubjug_development"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5433:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 26
          cache: "gradle"
      - name: "Create test template database"
        env:
          PGPASSWORD: postgres
        run: psql --host localhost --username postgres --dbname postgres < databases/create_databases.sql
      - name: "Migrate"
        run: ./gradlew :databases:catalog:migrate
      - name: "Build"
        run: ./gradlew build
